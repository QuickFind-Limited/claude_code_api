repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.4.1
    hooks:
      # Run the linter.
      - id: ruff
        exclude: ^(legacy/|src/claude_sdk_server/legacy/)
        types_or: [ python, pyi ]
        args: [ --fix ]
        stages: [ pre-commit ]
      # Run the formatter.
      - id: ruff-format
        exclude: ^(legacy/|src/claude_sdk_server/legacy/)
        types_or: [ python, pyi ]
        stages: [ pre-commit ]
